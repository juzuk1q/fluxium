name: Fluxium
description: "the worst vpn client in world"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  vize: ^1.0.4
  device_preview: ^1.3.1
  flutter_svg: ^2.3.0
  file_picker: 10.3.8
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/translations/
    - assets/fonts/
    - assets/emoji/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          style: normal
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          style: normal
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Extrabold.ttf
          style: normal
          weight: 800